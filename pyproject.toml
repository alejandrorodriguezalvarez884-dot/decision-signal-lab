[project]
name = "jevsignal"
version = "0.1.0"
description = "Research: do decision-model judgments (Perplexity Decider) on earnings releases predict post-reaction stock returns?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "lxml>=5.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pysentiment2>=0.1.1",
    "python-dotenv>=1.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "yfinance>=0.2.40",
]

[project.scripts]
jevsignal = "jevsignal.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
