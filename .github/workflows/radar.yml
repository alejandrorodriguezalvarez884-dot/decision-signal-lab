name: Radar

# Nothing here runs on a timer. The data is updated only when someone starts this workflow by
# hand (Actions > Radar > Run workflow): it looks for new results releases on EDGAR, scores
# them, commits radar/ and publishes the site in site/ to the gh-pages branch. A push that
# touches the site or the data rebuilds and publishes without fetching anything.
on:
  push:
    branches: [main]
    paths: ["site/**", "radar/**", ".github/workflows/radar.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn when the secrets are missing
        if: github.event_name != 'push' && (env.PERPLEXITY_API_KEY == '' || env.SEC_USER_AGENT == '')
        run: echo "::warning::PERPLEXITY_API_KEY or SEC_USER_AGENT is not set, so no new filings were fetched. The site is rebuilt from the committed data."

      - uses: astral-sh/setup-uv@v5
        if: github.event_name != 'push' && env.PERPLEXITY_API_KEY != '' && env.SEC_USER_AGENT != ''

      - name: Fetch and score new filings
        if: github.event_name != 'push' && env.PERPLEXITY_API_KEY != '' && env.SEC_USER_AGENT != ''
        env:
          # Per-run ceiling. A busy day in results season is about $0.05; the run fails
          # rather than spend past this.
          DECIDER_MAX_USD: "0.25"
        run: |
          uv sync --frozen --no-dev
          uv run decisionsignal radar update

      - name: Commit the dataset if it changed
        run: |
          if git diff --quiet -- radar/releases.json; then
            echo "No new filings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/
          git commit -m "Radar: add new releases"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Publish to the gh-pages branch
        working-directory: site/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
